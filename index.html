<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baby List</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍼</text></svg>">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e4e7ee;--accent:#3d5a80;--accent-ink:#fff;
  --idea:#eef0f4;--want:#ffe5a0;--got:#d4edbc;--skip:#e6e6e6;--bar:#7aa874;--chip-ink:#1d2433}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151c;--card:#1a202b;--ink:#e8ecf3;--muted:#98a2b3;--line:#2a3240;
  --accent:#8fb3e0;--accent-ink:#11151c;--idea:#2a3240;--want:#5c4a12;--got:#2f4a24;--skip:#30343b;--bar:#7aa874;--chip-ink:#e8ecf3}}
:root[data-theme="dark"]{--bg:#11151c;--card:#1a202b;--ink:#e8ecf3;--muted:#98a2b3;--line:#2a3240;
  --accent:#8fb3e0;--accent-ink:#11151c;--idea:#2a3240;--want:#5c4a12;--got:#2f4a24;--skip:#30343b;--bar:#7aa874;--chip-ink:#e8ecf3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent)}
header{background:var(--accent);color:var(--accent-ink);padding:18px 16px 14px}
header h1{margin:0;font-size:22px}
header .sub{opacity:.85;font-size:13px;margin-top:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:8px;padding-bottom:8px}
nav button{flex:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--muted);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h2.cat{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .name{font-weight:600}
.item .price{font-weight:700;white-space:nowrap;text-align:right}
.item .prod{color:var(--muted);font-size:13px;margin-top:2px;font-weight:400}
.item .why{font-size:14px;margin-top:6px}
.item .tip{font-size:13px;color:var(--muted);margin-top:4px}
.item .note{font-size:13px;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--idea)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px}
.chip{border-radius:999px;padding:2px 9px;font-weight:600;color:var(--chip-ink);background:var(--idea)}
.chip.Want{background:var(--want)}.chip.Got{background:var(--got)}.chip.Skip{background:var(--skip)}.chip.Added{background:var(--got)}
.item.is-Got .name,.item.is-Skip .name{text-decoration:line-through;opacity:.7}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.check .box{flex:none;width:20px;height:20px;border-radius:5px;border:2px solid var(--muted);display:grid;place-items:center;font-size:13px;margin-top:1px}
.check.done .box{background:var(--bar);border-color:var(--bar);color:#fff}
.check.done .t{text-decoration:line-through;opacity:.65}
.check .d{color:var(--muted);font-size:13px}
.check .when{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.check.overdue .when{color:#c0392b;font-weight:700}
.empty,.status{color:var(--muted);text-align:center;padding:24px 0}
footer{color:var(--muted);font-size:12px;text-align:center;padding:24px 16px 40px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>🍼 Baby List</h1>
    <div class="sub" id="sub">Loading from the shared Google Sheet…</div>
    <div class="actions">
      <a class="btn" id="edit" target="_blank" rel="noopener">✏️ Edit in Google Sheets</a>
      <a class="btn" id="xlsx">⬇️ Download spreadsheet</a>
      <button class="btn" id="refresh">↻ Refresh</button>
    </div>
  </div>
</header>
<nav><div class="wrap" role="tablist" id="tabs"></div></nav>
<main class="wrap">
  <div id="stats" class="stats"></div>
  <div id="filters"></div>
  <div id="view"><div class="status">Loading…</div></div>
</main>
<footer>Read-only view of the shared Google Sheet. Make changes in the sheet, then tap Refresh here.<br>Prices are checked on Amazon every Sunday.</footer>
<script>
const SHEET_ID = '1FF1emRD44TV5Z7ZaTbs8Smn3cc2Rtp_0DgR8RicBKac';
const GIDS = { 'Before birth': 0, 'First weeks': 900034665, 'Later': 808397599, 'Optional': 1519517898, 'To-do': 1733196324, 'Hospital bag': 39220311 };
const STAGES = ['Before birth', 'First weeks', 'Later', 'Optional'];
const CACHE = 'baby-list-sheet-v2';
const VIEWS = [['shop', 'Shopping'], ['registry', 'Registry'], ['todo', 'To-do'], ['bag', 'Hospital bag']];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (s) => { const n = parseFloat(String(s).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };

$('#edit').href = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
$('#xlsx').href = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx`;

let state = { view: 'shop', stage: 'Before birth', status: 'All' };
try { Object.assign(state, JSON.parse(localStorage.getItem(CACHE + '-ui') || '{}')); } catch {}
let data = null;

function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

async function fetchTab(name) {
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GIDS[name]}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(name + ': ' + r.status);
  return parseCsv(await r.text());
}

async function load() {
  $('#sub').textContent = 'Loading from the shared Google Sheet…';
  try {
    const names = Object.keys(GIDS);
    const tabs = await Promise.all(names.map(fetchTab));
    data = shape(Object.fromEntries(names.map((k, i) => [k, tabs[i]])));
    data.loaded = Date.now();
    try { localStorage.setItem(CACHE, JSON.stringify(data)); } catch {}
  } catch (e) {
    try { data = JSON.parse(localStorage.getItem(CACHE)); } catch {}
    if (!data) { $('#view').innerHTML = '<div class="status">Couldn’t reach the Google Sheet. Check your connection and tap Refresh.</div>'; $('#sub').textContent = 'Offline'; return; }
    data.stale = true;
  }
  render();
}

function shape(raw) {
  const items = [];
  for (const stage of STAGES) {
    let cat = '';
    raw[stage].slice(1).forEach((r) => {
      if (!r[1]) { if (r[0]) cat = r[0]; return; }
      const qty = num(r[3]), price = num(r[5]);
      items.push({ stage, cat: r[0] || cat, name: r[1], qty, product: r[4], price, total: qty * price,
        url: r[16] || '', rating: r[8], reviews: r[9], why: r[10], tip: r[11], status: r[12] || 'Idea',
        notes: r[13], registry: r[15] });
    });
  }
  const todo = []; let sec = '';
  raw['To-do'].slice(3).forEach((r) => {
    if (r[0] === '' && r[1] && !r[2]) { sec = r[1]; return; }
    if (r[1]) todo.push({ sec, done: r[0] === 'TRUE', task: r[1], date: r[2], note: r[3] });
  });
  const bag = []; sec = '';
  raw['Hospital bag'].slice(3).forEach((r) => {
    if (r[0] === '' && r[1]) { sec = r[1]; return; }
    if (r[1]) bag.push({ sec, done: r[0] === 'TRUE', item: r[1], note: r[2] });
  });
  return { items, todo, bag };
}

function setState(patch) {
  Object.assign(state, patch);
  try { localStorage.setItem(CACHE + '-ui', JSON.stringify(state)); } catch {}
  render();
}

function stat(label, value, pct) {
  return `<div class="stat"><span>${label}</span><b>${value}</b>${pct != null ? `<div class="bar"><i style="width:${Math.round(pct * 100)}%"></i></div>` : ''}</div>`;
}

function itemCard(it) {
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">View on Amazon</a>` : '';
  const rating = it.rating ? `★ ${esc(it.rating)}${it.reviews ? ` (${esc(it.reviews)})` : ''}` : '';
  return `<div class="item is-${esc(it.status)}">
    <div class="top"><div><div class="name">${esc(it.name)}</div><div class="prod">${esc(it.product)}</div></div>
      <div class="price">${it.price ? money(it.total) : 'Free'}${it.qty > 1 ? `<div class="prod">${it.qty} × ${money(it.price)}</div>` : ''}</div></div>
    ${it.why ? `<div class="why">${esc(it.why)}</div>` : ''}
    ${it.tip ? `<div class="tip">💡 ${esc(it.tip)}</div>` : ''}
    ${it.notes ? `<div class="note">📝 ${esc(it.notes)}</div>` : ''}
    <div class="meta"><span class="chip ${esc(it.status)}">${esc(it.status)}</span>
      ${it.registry ? `<span class="chip ${esc(it.registry)}">Registry: ${esc(it.registry)}</span>` : ''}
      <span>${rating}</span>${link ? `<span>· ${link}</span>` : ''}</div>
  </div>`;
}

function grouped(list, key, card) {
  return [...new Set(list.map((x) => x[key]))]
    .map((k) => `<h2 class="cat">${esc(k)}</h2>` + list.filter((x) => x[key] === k).map(card).join('')).join('');
}

function render() {
  $('#tabs').innerHTML = VIEWS.map(([k, l]) => `<button role="tab" aria-selected="${state.view === k}" data-view="${k}">${l}</button>`).join('');
  if (!data) return;
  $('#sub').textContent = (data.stale ? 'Offline — showing the copy from ' : 'Updated ')
    + new Date(data.loaded).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const active = (x) => x.status !== 'Skip';
  const its = data.items;

  if (state.view === 'shop') {
    const inStage = state.stage === 'All' ? its : its.filter((x) => x.stage === state.stage);
    const cost = inStage.filter(active).reduce((s, x) => s + x.total, 0);
    const left = inStage.filter((x) => active(x) && x.status !== 'Got').reduce((s, x) => s + x.total, 0);
    const got = inStage.filter((x) => x.status === 'Got').length, need = inStage.filter(active).length;
    $('#stats').innerHTML = stat('Total' + (state.stage === 'All' ? '' : ' · ' + state.stage), money(cost))
      + stat('Still to buy', money(left)) + stat('Have', `${got} of ${need}`, need ? got / need : 0);
    $('#filters').innerHTML = `<div class="filters">${[...STAGES, 'All'].map((s) => `<button aria-pressed="${state.stage === s}" data-stage="${s}">${s}</button>`).join('')}</div>
      <div class="filters">${['All', 'Idea', 'Want', 'Got', 'Skip'].map((s) => `<button aria-pressed="${state.status === s}" data-status="${s}">${s === 'All' ? 'Any status' : s}</button>`).join('')}</div>`;
    const list = inStage.filter((x) => state.status === 'All' || x.status === state.status);
    $('#view').innerHTML = list.length ? grouped(list, state.stage === 'All' ? 'stage' : 'cat', itemCard) : '<div class="empty">Nothing here.</div>';
  }

  if (state.view === 'registry') {
    const reg = its.filter((x) => x.registry);
    const want = reg.filter((x) => x.registry === 'Want'), added = reg.filter((x) => x.registry === 'Added');
    const disc = reg.filter((x) => active(x) && x.status !== 'Got').reduce((s, x) => s + x.total, 0) * 0.15;
    $('#stats').innerHTML = stat('To add', want.length) + stat('Added', `${added.length} of ${reg.length}`, reg.length ? added.length / reg.length : 0)
      + stat('Est. 15% completion discount', money(disc));
    $('#filters').innerHTML = '';
    $('#view').innerHTML = reg.length
      ? (want.length ? '<h2 class="cat">To add — tap the link, then “Add to Baby Registry”</h2>' + want.map(itemCard).join('') : '')
        + (added.length ? '<h2 class="cat">Already on the registry</h2>' + added.map(itemCard).join('') : '')
      : '<div class="empty">Nothing marked yet. In the sheet, set an item’s Registry column to “Want”.</div>';
  }

  if (state.view === 'todo') {
    const done = data.todo.filter((x) => x.done).length;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const next = data.todo.find((x) => !x.done);
    $('#stats').innerHTML = stat('Done', `${done} of ${data.todo.length}`, data.todo.length ? done / data.todo.length : 0)
      + (next ? stat('Next up', `<span style="font-size:15px">${esc(next.task)}</span>`) : '');
    $('#filters').innerHTML = '';
    $('#view').innerHTML = grouped(data.todo, 'sec', (x) => {
      const due = new Date(x.date), over = !x.done && !isNaN(due) && due < today;
      return `<div class="check ${x.done ? 'done' : ''} ${over ? 'overdue' : ''}"><div class="box">${x.done ? '✓' : ''}</div>
        <div><div class="t">${esc(x.task)}</div>${x.note ? `<div class="d">${esc(x.note)}</div>` : ''}</div>
        <div class="when">${isNaN(due) ? esc(x.date) : due.toLocaleDateString([], { month: 'short', day: 'numeric' })}</div></div>`;
    });
  }

  if (state.view === 'bag') {
    const done = data.bag.filter((x) => x.done).length;
    $('#stats').innerHTML = stat('Packed', `${done} of ${data.bag.length}`, data.bag.length ? done / data.bag.length : 0) + stat('Pack by', '36 weeks');
    $('#filters').innerHTML = '';
    $('#view').innerHTML = grouped(data.bag, 'sec', (x) => `<div class="check ${x.done ? 'done' : ''}"><div class="box">${x.done ? '✓' : ''}</div>
      <div><div class="t">${esc(x.item)}</div>${x.note ? `<div class="d">${esc(x.note)}</div>` : ''}</div></div>`);
  }
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.view) setState({ view: b.dataset.view });
  else if (b.dataset.stage) setState({ stage: b.dataset.stage });
  else if (b.dataset.status) setState({ status: b.dataset.status });
  else if (b.id === 'refresh') load();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && data && Date.now() - data.loaded > 60000) load(); });

try { data = JSON.parse(localStorage.getItem(CACHE)); if (data) render(); } catch {}
load();
</script>
</body>
</html>
